name: Android interoperability research

on:
  workflow_dispatch:
    inputs:
      warmup_seconds:
        description: Seconds to wait after launching the app
        required: true
        default: "45"
        type: string

permissions:
  contents: read

concurrency:
  group: xygj-kvm-emulator-research
  cancel-in-progress: false

env:
  APK_SHA256: 625184711e70a09f08f1bf3365ac7e31e25887bac8b171a33c9f4092c74e8a04
  APK_URL: https://imtt.dd.qq.com/sjy.00022/sjy.00004/16891/apk/B31425CA64BBF8161D5A7D2F78607EEE.apk?fsname=com.yueme.itv_6.11.4.apk
  DARKDEX_COMMIT: 0862ceba78aa89f58a14edf11717ae0339aaa592
  DARKDEX_SOURCE_SHA256: ea96bca0588668c4bafc9e7e8bd7e720a311e54a9f61e3e3166c8eca43cb773a
  PACKAGE: com.yueme.itv

jobs:
  research:
    name: Research ${{ matrix.slug }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: api28-x86-shell
            api_level: 28
          - slug: api30-x86-shell
            api_level: 30
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out encryption configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize private workspace
        env:
          WARMUP_SECONDS: ${{ inputs.warmup_seconds }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$WARMUP_SECONDS" =~ ^[0-9]+$ ]] \
            || (( WARMUP_SECONDS < 15 || WARMUP_SECONDS > 180 )); then
            echo "warmup_seconds must be between 15 and 180" >&2
            exit 1
          fi
          mkdir -p private/diagnostics private/output encrypted
          : > private/diagnostics/adb-devices.txt
          : > private/diagnostics/android-logcat.txt
          : > private/diagnostics/app-processes.txt
          : > private/diagnostics/emulator-properties.txt
          : > private/diagnostics/extraction.txt
          : > private/diagnostics/host-dmesg.txt
          : > private/diagnostics/result.txt
          openssl x509 -in encryption/artifact-recipient-cert.pem \
            -noout -fingerprint -sha256

      - name: Download and verify reproducible inputs
        timeout-minutes: 10
        run: |
          set -euo pipefail
          curl --fail --location \
            --retry 5 --retry-all-errors --connect-timeout 30 \
            --output private/target.apk "$APK_URL"
          echo "$APK_SHA256  private/target.apk" \
            | sha256sum --check --strict
          test "$(stat -c '%s' private/target.apk)" = 237327095

          curl --fail --location \
            --retry 5 --retry-all-errors --connect-timeout 30 \
            --output private/darkdex_dump.cpp \
            "https://raw.githubusercontent.com/Krainium/DarkDex/$DARKDEX_COMMIT/native/darkdex_dump.cpp"
          echo "$DARKDEX_SOURCE_SHA256  private/darkdex_dump.cpp" \
            | sha256sum --check --strict
          patch --batch --fuzz=0 --forward private/darkdex_dump.cpp \
            < patches/darkdex-ptrace.patch

          toolchain="$(find "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt" \
            -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$toolchain"
          "$toolchain/bin/x86_64-linux-android21-clang++" \
            -O2 -std=c++17 -fPIE -pie -static-libstdc++ \
            -o private/libdd private/darkdex_dump.cpp
          file private/libdd
          chmod 700 private/libdd

          mkdir -p private/x86-libs/lib/x86_64
          unzip -p private/target.apk \
            lib/arm64-v8a/libexec_x86.so \
            > private/x86-libs/lib/x86_64/libexec_x86.so
          unzip -p private/target.apk \
            lib/arm64-v8a/libexecmain_x86.so \
            > private/x86-libs/lib/x86_64/libexecmain_x86.so
          unzip -p private/target.apk \
            lib/arm64-v8a/libhts_x86.so \
            > private/x86-libs/lib/x86_64/libhts_x86.so
          unzip -p private/target.apk \
            lib/arm64-v8a/libexecoat_x86.so \
            > private/x86-libs/lib/x86_64/libexecoat_x86.so
          sha256sum --check --strict <<'EOF'
          50c8fd5fdd33f3b4ef8ffd994204e443009e2f896d5f1a28cba53196318bf873  private/x86-libs/lib/x86_64/libexec_x86.so
          6c1f09928e006d85e02a047c2195b3281335d3f718d8d47b83f84345a2804689  private/x86-libs/lib/x86_64/libexecmain_x86.so
          7d7db99b686726d15b709e01ce8a5eb9f23e2e49ee8998671200fdd2ad017d88  private/x86-libs/lib/x86_64/libhts_x86.so
          25cf72115a49ff4124cc56deb41b29007f5e54708b714036ea54ed04c3445e45  private/x86-libs/lib/x86_64/libexecoat_x86.so
          EOF

          # The x86 shell imports kill solely for its anti-tamper shutdown.
          # Redirect that JUMP_SLOT to the already imported getpid symbol so
          # the ephemeral research APK can survive its changed signature.
          test "$(od -An -tx1 -j $((0x21dec)) -N 4 \
            private/x86-libs/lib/x86_64/libexec_x86.so \
            | tr -d ' \n')" = "67000000"
          printf '\x2d\x00\x00\x00' \
            | dd of=private/x86-libs/lib/x86_64/libexec_x86.so \
              bs=1 seek=$((0x21dec)) conv=notrunc status=none
          echo "3f2625c54198d8a7ba7b40e4f4b6e956d057a3dc3cf8f50cfb2648e226db5eaa  private/x86-libs/lib/x86_64/libexec_x86.so" \
            | sha256sum --check --strict

          cp private/target.apk private/target-x86-unsigned.apk
          zip -q -d private/target-x86-unsigned.apk 'META-INF/*'
          (cd private/x86-libs && \
            zip -q -0 -r ../target-x86-unsigned.apk lib)
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/zipalign" -f -p 4 \
            private/target-x86-unsigned.apk private/target-x86-aligned.apk
          keytool -genkeypair -noprompt \
            -keystore private/research-signing.jks \
            -storepass android -keypass android -alias research \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Ephemeral CI Research'
          "$build_tools/apksigner" sign \
            --ks private/research-signing.jks \
            --ks-pass pass:android --key-pass pass:android \
            --out private/target-x86.apk \
            private/target-x86-aligned.apk
          "$build_tools/apksigner" verify --verbose \
            private/target-x86.apk

      - name: Enable KVM hardware acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run research in Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          WARMUP_SECONDS: ${{ inputs.warmup_seconds }}
          APK_VARIANT: x86-shell
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          disable-linux-hw-accel: false
          script: bash scripts/emulator-research.sh

      - name: Collect private diagnostics
        if: always()
        run: |
          set +e

          if ! test -s private/diagnostics/adb-devices.txt; then
            timeout 10s adb devices -l \
              > private/diagnostics/adb-devices.txt 2>&1
          fi
          if ! test -s private/diagnostics/android-logcat.txt; then
            timeout 20s adb logcat -d -t 3000 \
              > private/diagnostics/android-logcat.txt 2>&1
          fi
          if ! test -s private/diagnostics/app-exit-info.txt; then
            timeout 15s adb shell \
              dumpsys activity exit-info "$PACKAGE" \
              > private/diagnostics/app-exit-info.txt 2>&1
          fi
          uname -a > private/diagnostics/host-system.txt 2>&1
          sudo dmesg --ctime | tail -500 \
            > private/diagnostics/host-dmesg.txt 2>&1
          find private -type f -printf '%P\t%s bytes\n' \
            > private/diagnostics/file-inventory.txt

      - name: Encrypt all research output
        if: always()
        run: |
          set -euo pipefail
          test -s encryption/artifact-recipient-cert.pem
          echo "run_id=$GITHUB_RUN_ID" \
            > private/diagnostics/run-metadata.txt
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" \
            >> private/diagnostics/run-metadata.txt
          echo "head_sha=$GITHUB_SHA" \
            >> private/diagnostics/run-metadata.txt
          echo "matrix_slug=${{ matrix.slug }}" \
            >> private/diagnostics/run-metadata.txt
          echo "api_level=${{ matrix.api_level }}" \
            >> private/diagnostics/run-metadata.txt

          # APKs and the extractor are pinned reproducible inputs. Only runtime
          # output and diagnostics belong in the encrypted artifact.
          tar --create --gzip --file private/research-output.tar.gz \
            --directory private output diagnostics
          rm -f encrypted/research-output.cms encrypted/SHA256SUMS
          openssl cms -encrypt -binary -aes-256-gcm \
            -in private/research-output.tar.gz \
            -outform DER \
            -out encrypted/research-output.cms \
            encryption/artifact-recipient-cert.pem
          test -s encrypted/research-output.cms
          sha256sum encrypted/research-output.cms \
            > encrypted/SHA256SUMS
          openssl cms -cmsout -inform DER \
            -in encrypted/research-output.cms -noout

          sudo find private -type f -exec shred -u -- {} +
          sudo find private -depth -type d -empty -delete
          echo "Encrypted artifact created with RSA-4096 and AES-256-GCM"

      - name: Upload encrypted artifact only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: encrypted-research-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
          path: encrypted/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
